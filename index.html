<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura — Lo-Fi Focus & Chill Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #a78bfa;
            --accent-glow: rgba(167, 139, 250, 0.25);
            --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0b0f19 70%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            transition: background 0.8s ease;
            overflow-x: hidden;
        }

        /* Ambient floating lights */
        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: var(--accent);
            opacity: 0.12;
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            transition: background 0.8s ease;
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
        }

        /* Dashboard Grid Layout */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1050px;
            margin-bottom: 20px;
            animation: fadeInUp 0.8s ease;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Specific Grid Spans */
        .timer-card { grid-column: span 6; }
        .todo-card { grid-column: span 6; }
        .radio-card { grid-column: span 12; }
        .theme-card { grid-column: span 12; }

        @media (max-width: 768px) {
            .timer-card, .todo-card { grid-column: span 12; }
        }

        /* Buttons & Inputs */
        button {
            background-color: var(--accent);
            color: #0b0f19;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        button.outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            box-shadow: none;
        }

        button.outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent);
        }

        /* Timer UI */
        .timer-display {
            font-size: 3.8rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            margin: 10px 0 20px 0;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Todo List UI */
        .todo-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .todo-list {
            list-style: none;
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .todo-list::-webkit-scrollbar {
            width: 4px;
        }
        .todo-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .todo-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .todo-item.done span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .todo-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            box-shadow: none;
            font-size: 0.85rem;
        }
        .icon-btn:hover {
            color: #ff6b6b;
            transform: none;
        }

        /* Radio & Music Player UI */
        .radio-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .station-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .vinyl-disc {
            width: 56px;
            height: 56px;
            background: radial-gradient(circle, #111 30%, #1f1f1f 31%, #111 60%);
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: spin 3s linear infinite paused;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .vinyl-disc.playing {
            animation-play-state: running;
        }

        .vinyl-inner {
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .song-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .song-status {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Theme & Vibe Selector UI */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .theme-btn {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: none;
        }

        .theme-btn:hover {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        /* Footer Quote */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            max-width: 600px;
            line-height: 1.5;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow" id="glow"></div>

    <header>
        <h1>Aura Sanctuary</h1>
        <p>Immersive soundscapes & distraction-free flow state.</p>
    </header>

    <div class="dashboard">
        <!-- Pomodoro Card -->
        <div class="card timer-card">
            <div class="card-title">⏱️ Focus Timer</div>
            <div class="timer-display" id="timer">25:00</div>
            <div class="timer-controls">
                <button id="main-timer-btn" onclick="toggleTimer()">Start Flow</button>
                <button class="outline" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- Todo Card -->
        <div class="card todo-card">
            <div class="card-title">📝 Focus Tasks</div>
            <div class="todo-input-group">
                <input type="text" id="task-input" placeholder="What's your priority?">
                <button onclick="addTask()">Add</button>
            </div>
            <ul class="todo-list" id="todo-list">
                <!-- Tasks injected via JS -->
            </ul>
        </div>

        <!-- Radio Card -->
        <div class="card radio-card">
            <div class="card-title">🎵 Live Lo-Fi Stream</div>
            <div class="radio-content">
                <div class="station-info">
                    <div class="vinyl-disc" id="vinyl">
                        <div class="vinyl-inner"></div>
                    </div>
                    <div>
                        <div class="song-title">Chill Beats 24/7 Radio</div>
                        <div class="song-status" id="radio-status">Paused</div>
                    </div>
                </div>
                <button id="radio-btn" onclick="toggleRadio()">▶ Play Beats</button>
            </div>
            <audio id="lofi-audio" src="https://stream.zeno.fm/f3wvbbqmdg8uv" preload="none"></audio>
        </div>

        <!-- Theme Switcher Card -->
        <div class="card theme-card">
            <div class="card-title">🎨 Atmosphere Switcher</div>
            <div class="theme-grid">
                <button class="theme-btn" onclick="setVibe('purple', '#0b0f19', '#1e1b4b', '#a78bfa', 'radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0b0f19 70%)')">💜 Midnight</button>
                <button class="theme-btn" onclick="setVibe('blue', '#020617', '#0f172a', '#38bdf8', 'radial-gradient(circle at 50% 20%, #0f172a 0%, #020617 70%)')">🌧️ Rainy Blue</button>
                <button class="theme-btn" onclick="setVibe('amber', '#18120b', '#29211a', '#fb923c', 'radial-gradient(circle at 50% 20%, #29211a 0%, #18120b 70%)')">☕ Warm Café</button>
                <button class="theme-btn" onclick="setVibe('emerald', '#022c22', '#064e3b', '#34d399', 'radial-gradient(circle at 50% 20%, #064e3b 0%, #022c22 70%)')">🌿 Forest Pine</button>
            </div>
        </div>
    </div>

    <footer id="quote-footer">
        "Focus is a muscle. The more you practice eliminating distractions, the easier it becomes."
    </footer>

    <script>
        // --- Timer Logic ---
        let timeLeft = 25 * 60;
        let timerRunning = false;
        let timerInterval = null;
        const timerDisplay = document.getElementById('timer');
        const mainTimerBtn = document.getElementById('main-timer-btn');

        function updateTimerText() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (!timerRunning) {
                timerRunning = true;
                mainTimerBtn.textContent = "Pause";
                mainTimerBtn.classList.add('outline');
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerText();
                    } else {
                        clearInterval(timerInterval);
                        timerRunning = false;
                        mainTimerBtn.textContent = "Start Flow";
                        mainTimerBtn.classList.remove('outline');
                        alert("Great focus session! Take a deep breath break.");
                    }
                }, 1000);
            } else {
                clearInterval(timerInterval);
                timerRunning = false;
                mainTimerBtn.textContent = "Resume";
                mainTimerBtn.classList.remove('outline');
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            timeLeft = 25 * 60;
            updateTimerText();
            mainTimerBtn.textContent = "Start Flow";
            mainTimerBtn.classList.remove('outline');
        }

        // --- Todo List Logic ---
        const taskInput = document.getElementById('task-input');
        const todoList = document.getElementById('todo-list');

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            const li = document.createElement('li');
            li.className = 'todo-item';
            li.innerHTML = `
                <span>${text}</span>
                <div class="todo-actions">
                    <button class="icon-btn" onclick="toggleTask(this)">✓</button>
                    <button class="icon-btn" onclick="this.closest('li').remove()">✕</button>
                </div>
            `;
            todoList.appendChild(li);
            taskInput.value = '';
        }

        function toggleTask(btn) {
            const item = btn.closest('.todo-item');
            item.classList.toggle('done');
        }

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // --- Radio / Lo-Fi Audio Logic ---
        const audio = document.getElementById('lofi-audio');
        const radioBtn = document.getElementById('radio-btn');
        const vinyl = document.getElementById('vinyl');
        const radioStatus = document.getElementById('radio-status');
        let isPlaying = false;

        function toggleRadio() {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    radioBtn.textContent = "⏸ Pause Beats";
                    vinyl.classList.add('playing');
                    radioStatus.textContent = "Now Streaming Live 🎧";
                }).catch(err => {
                    alert("Click play again to start the stream.");
                });
            } else {
                audio.pause();
                isPlaying = false;
                radioBtn.textContent = "▶ Play Beats";
                vinyl.classList.remove('playing');
                radioStatus.textContent = "Paused";
            }
        }

        // --- Theme & Atmosphere Switcher ---
        function setVibe(name, bgColor, cardColor, accentColor, gradient) {
            document.documentElement.style.setProperty('--bg-color', bgColor);
            document.documentElement.style.setProperty('--card-bg', cardColor);
            document.documentElement.style.setProperty('--accent', accentColor);
            document.documentElement.style.setProperty('--accent-glow', accentColor + '40');
            document.documentElement.style.setProperty('--bg-gradient', gradient);
            document.getElementById('glow').style.background = accentColor;
        }

        // Random dynamic motivational quotes on load
        const quotes = [
            "\"Focus is a muscle. The more you practice eliminating distractions, the easier it becomes.\"",
            "\"Almost everything will work again if you unplug it for a few minutes... including you.\"",
            "\"Quiet the mind, and the soul will speak.\"",
            "\"Action is the foundational key to all success.\""
        ];
        document.getElementById('quote-footer').textContent = quotes[Math.floor(Math.random() * quotes.length)];
    </script>
</body>
</html>
